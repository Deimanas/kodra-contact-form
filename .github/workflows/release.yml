name: Build & Release WordPress Plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: kodra-contact-form
      MAIN_FILE: kodra-contact-form.php

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version header matches tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "Tag version: $VERSION"
          if [ ! -f "$MAIN_FILE" ]; then
            echo "::error file=$MAIN_FILE::Main plugin file not found. Adjust MAIN_FILE in workflow env."
            exit 1
          fi
          if ! grep -E "^[[:space:]]*(\\*|)//?[[:space:]]*Version:[[:space:]]*$VERSION\\b" "$MAIN_FILE" && \
             ! grep -E "^[[:space:]]*Version:[[:space:]]*$VERSION\\b" "$MAIN_FILE"; then
            echo "::error file=$MAIN_FILE::Version header does not match tag $VERSION"
            echo "Ensure the header 'Version: $VERSION' is set in $MAIN_FILE."
            exit 1
          fi

      - name: Build plugin ZIP (stable slug inside ZIP)
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p "build/$PLUGIN_SLUG"
          rsync -a ./ "build/$PLUGIN_SLUG"/ \
            --exclude '.git' \
            --exclude '.gitignore' \
            --exclude '.github' \
            --exclude '.vscode' \
            --exclude 'node_modules' \
            --exclude 'build' \
            --exclude '*.zip' \
            --exclude '*.yml' \
            --exclude '*.yaml' \
            --exclude '*.md'
          cd build
          zip -r "../$PLUGIN_SLUG.zip" "$PLUGIN_SLUG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN_SLUG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
