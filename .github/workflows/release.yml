name: Build & Release WordPress Plugin ZIP

on:
  push:
    tags:
      - 'v*'   # e.g., v1.6.4.3

permissions:
  contents: write

env:
  SLUG: kodra-contact-form

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Inject version into plugin headers (PHP + readme.txt, if present)
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.VERSION }}"
          MAIN_FILE="${{ env.SLUG }}.php"

          if [ -f "$MAIN_FILE" ]; then
            # Update the 'Version:' header line
            sed -i -E "s/^(\s*\*\s*Version:\s*).*/\1${VERSION}/" "$MAIN_FILE"
          else
            echo "Warning: $MAIN_FILE not found – skipping PHP header bump."
          fi

          if [ -f "readme.txt" ]; then
            # Update the Stable tag in readme.txt (WordPress standard)
            sed -i -E "s/^(Stable tag:\s*).*/\1${VERSION}/I" "readme.txt"
          fi

      - name: Verify version header matches tag (after injection)
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.VERSION }}"
          MAIN_FILE="${{ env.SLUG }}.php"
          if [ -f "$MAIN_FILE" ]; then
            if ! grep -E "^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*${VERSION}\s*$" "$MAIN_FILE" > /dev/null; then
              echo "Error: Version header does not match tag ${VERSION} in ${MAIN_FILE}."
              exit 1
            fi
          fi
          echo "Version header OK: ${VERSION}"

      - name: Build plugin ZIP (stable slug directory inside)
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.VERSION }}"
          SLUG="${{ env.SLUG }}"
          WORKDIR="$(mktemp -d)"
          DEST="${WORKDIR}/${SLUG}"
          mkdir -p "$DEST"

          # Copy repository files into a folder named after the plugin slug
          rsync -a --exclude ".git"                  --exclude ".github"                  --exclude "*.zip"                  --exclude "node_modules"                  --exclude ".DS_Store"                  --exclude "README.md"                  ./ "$DEST/"

          # Create versioned release asset with a stable inner folder name
          ZIP_NAME="${SLUG}-v${VERSION}.zip"
          ( cd "$WORKDIR" && zip -r "$ZIP_NAME" "$SLUG" >/dev/null )
          mv "$WORKDIR/$ZIP_NAME" "./$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.ZIP_NAME }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
